dataset:
  name: utkface
  config:
    filter_gender: null
  val_indices: configs/utkface-all_val_indices.npy
  val_corruption:
    corruption_type: all
    severity: 5

regressor:
  source: result/source/utkface/source_model_29700.pt
  type: image
  config:
    backbone: resnet50
    pretrained: false
    in_channels: 3

optimizer:
  param: all
  name: Adam
  config:
    lr: 2.5e-4
    weight_decay: 0.0

tta:
  config:
    train_mode: true
    act_stats_file: result/source/utkface/act_stats.pt
    # ResNet50 has ~53 BN layers; paper: "distributed evenly across the
    # network".  8 layers ≈ one per residual stage + stem + intermediates.
    max_layers: 8
    compile_model: &compile_model null

evaluator:
  compile_model: *compile_model

adapt_dataloader:
  batch_size: 64
  shuffle: true

val_dataloader:
  batch_size: 256