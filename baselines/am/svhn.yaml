dataset:
  name: mnist

regressor:
  source: result/source/svhn/source_model_114500.pt
  type: image
  config:
    backbone: resnet26
    pretrained: false
    in_channels: 3

optimizer:
  param: all
  name: Adam
  config:
    lr: 0.001
    weight_decay: 0.0

tta:
  config:
    train_mode: true
    act_stats_file: result/source/svhn/act_stats.pt
    max_layers: 8
    compile_model: &compile_model null

evaluator:
  compile_model: *compile_model

adapt_dataloader:
  batch_size: 64
  shuffle: true

val_dataloader:
  batch_size: 256