dataset:
  name: utkface
  config:
    filter_gender: null
  val_indices: configs/utkface-all_val_indices.npy
  val_corruption:
    corruption_type: all
    severity: 5

regressor:
  source: result/source/utkface/source_model_29700.pt
  type: image
  config:
    backbone: resnet50
    pretrained: false
    in_channels: 3

tta:
  config:
    train_mode: true
    bottom_up: true          # true = BUFR (layer-by-layer); false = joint FR
    epochs_per_block: 1      # epochs per block (bottom-up) or total (joint)
    lr: 0.001
    weight_decay: 0.0
    lr_decay: 5.0            # LR multiplied by 1/lr_decay^block_idx
    compile_model: &compile_model null

evaluator:
  compile_model: *compile_model

adapt_dataloader:
  batch_size: 64
  shuffle: true

val_dataloader:
  batch_size: 256