adapt_dataloader:
  batch_size: 64
  shuffle: true
dataset:
  config:
    filter_gender: null
  name: utkface
  val_corruption:
    corruption_type: all
    severity: 5
  val_indices: configs/utkface-all_val_indices.npy
evaluator:
  compile_model: null
optimizer:
  config:
    lr: 0.00025
    weight_decay: 0.0
  name: Adam
  param: all
regressor:
  config:
    backbone: resnet50
    in_channels: 3
    pretrained: false
  source: result/source/utkface/source_model_29700.pt
  type: image
tta:
  config:
    act_stats_file: result/source/utkface/act_stats.pt
    compile_model: null
    max_layers: 8
    train_mode: true
val_dataloader:
  batch_size: 256
