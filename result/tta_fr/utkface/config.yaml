adapt_dataloader:
  batch_size: 64
  shuffle: true
dataset:
  config:
    filter_gender: null
  name: utkface
  val_corruption:
    corruption_type: all
    severity: 5
  val_indices: configs/utkface-all_val_indices.npy
evaluator:
  compile_model: null
regressor:
  config:
    backbone: resnet50
    in_channels: 3
    pretrained: false
  source: result/source/utkface/source_model_29700.pt
  type: image
tta:
  config:
    bottom_up: true
    compile_model: null
    epochs_per_block: 1
    lr: 0.001
    lr_decay: 5.0
    train_mode: true
    weight_decay: 0.0
val_dataloader:
  batch_size: 256
